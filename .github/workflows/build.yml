
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip (first run only)
        run: |
          if [ -f project.zip ]; then
            unzip -q -o project.zip
            rm project.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Add HTML2MP4 project"
            git push
          fi
      - uses: actions/setup-java@v4
        if: hashFiles('gradlew') != ''
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        if: hashFiles('gradlew') != ''
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        if: hashFiles('gradlew') != ''
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          rc=$?
          tail -n 30 build.log
          if [ $rc -ne 0 ]; then
            # surface compiler errors as a single annotation (readable via the checks API)
            msg=$(grep -E '^e: |error:|What went wrong|Execution failed|Could not resolve' -A3 build.log | head -60 | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: hashFiles('gradlew') != ''
        with:
          name: HTML2MP4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
