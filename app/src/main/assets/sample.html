const gl=document.getElementById('gl'), ctx=gl.getContext('webgl');

gl.width=Math.round(innerWidth/2); gl.height=Math.round(innerHeight/2);
// --- WebGL: rotating triangle ---
function sh(t,s){const x=ctx.createShader(t);ctx.shaderSource(x,s);ctx.compileShader(x);return x}
const pr=ctx.createProgram();
ctx.attachShader(pr,sh(ctx.VERTEX_SHADER,'attribute vec2 p;attribute vec3 c;varying vec3 v;uniform float a;void main(){float s=sin(a),k=cos(a);gl_Position=vec4(k*p.x-s*p.y,s*p.x+k*p.y,0.,1.);v=c;}'));

const la=ctx.getUniformLocation(pr,'a');

const au=new Audio(AUDIO); let t0=null;
document.getElementById('start').addEventListener('click',()=>{au.play(); t0=performance.now(); document.getElementById('start').style.display='none';});
function frame(now){
  const t=t0===null?0:(now-t0)/1000;
  if(t0!==null && !au.ended) au.playbackRate=1+0.25*Math.sin(2*Math.PI*t/2.5);
  g2.fillStyle='#10193a'; g2.fillRect(0,0,c2.width,c2.height);
  for(let i=0;i<6;i++){
    const x=(Math.sin(t*1.3+i)*.5+.5)*c2.width, y=Math.abs(Math.sin(t*1.7+i*.8))*c2.height;
    g2.fillStyle='hsl('+((i*60+t*90)%360)+',85%,60%)'; g2.beginPath(); g2.arc(x,y,c2.height*.07,0,7); g2.fill();

  g2.fillStyle='#fff'; g2.font=Math.round(c2.height*.12)+'px sans-serif'; g2.fillText('canvas  t='+t.toFixed(2),12,c2.height*.14);

  requestAnimationFrame(frame);
}
